openapi: 3.0.3
info:
  title: ta-platform API
  version: 0.1.0
  description: >
    Candidate and admin HTTP APIs for the ta-platform talent-acquisition
    platform. Admin API routes are company-scoped: the company comes from
    the member's session, and x-permission names the RBAC permission each
    route requires (see internal/rbac).
servers:
  - url: /v1

paths:
  /interviews/{id}/timeline:
    get:
      operationId: getInterviewTimeline
      summary: Replay an interview's events after an optional sequence cursor.
      tags: [replay]
      security:
        - companySession: []
      parameters:
        - $ref: "#/components/parameters/InterviewId"
        - name: after_seq
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: Events ordered by ascending sequence number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /session/start:
    post:
      operationId: startSession
      summary: Exchange a one-time invite for a scoped Candidate Workspace session token.
      tags: [session]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
      responses:
        "200":
          description: An Active Candidate Workspace session.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartSessionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /session/prompt:
    post:
      operationId: submitPrompt
      summary: Send a prompt to the AI assistant and stream its answer.
      description: >
        Records prompt.submitted (allocating its sequence number) before any
        side effect, then relays the AI Gateway's answer as Server-Sent
        Events: one `prompt` event (PromptAccepted), zero or more `delta`
        events (PromptDelta), and exactly one `done` event (PromptDone).
        Closing the connection cancels the upstream model call.
      tags: [session]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromptRequest"
      responses:
        "200":
          description: An event stream of PromptAccepted, PromptDelta and PromptDone events.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /session/run:
    post:
      operationId: runCode
      summary: Run the candidate's code in the Execution Sandbox and wait for the result.
      description: >
        Stores a snapshot of the files, records execution.requested, runs
        the code synchronously in the sandbox, and records
        execution.completed. Only one run per session may be in flight; a
        second request while one is active gets 429.
      tags: [session]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: The finished run. Program failures and timeouts are results, not errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /session/diff:
    post:
      operationId: submitDiff
      summary: Record one debounced edit to a workspace file.
      description: >
        The client debounces keystrokes into one unified diff per burst and
        numbers diffs from 1 per session. A diff whose clientSeq is not
        greater than the last accepted one is dropped (200, accepted
        false). Accepted diffs are recorded as code.diff with lines
        added/removed.
      tags: [session]
      security:
        - sessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiffRequest"
      responses:
        "202":
          description: Accepted and recorded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffResult"
        "200":
          description: Dropped as out of order; do not retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiffResult"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /candidate/me:
    get:
      operationId: getCurrentCandidate
      summary: Get the authenticated candidate's profile.
      tags: [candidate]
      security:
        - sessionToken: []
      responses:
        "200":
          description: The candidate profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "409":
          description: The session exists but is not Active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /candidate/applications:
    get:
      operationId: listMyApplications
      summary: List the authenticated candidate's applications.
      tags: [candidate]
      security:
        - sessionToken: []
      responses:
        "200":
          description: The candidate's applications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "409":
          description: The session exists but is not Active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /company:
    get:
      operationId: getCompany
      summary: The member's company.
      tags: [admin]
      security:
        - companySession: []
      x-permission: company:read
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateCompany
      summary: Rename the company.
      tags: [admin]
      security:
        - companySession: []
      x-permission: company:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        default:
          $ref: "#/components/responses/Error"

  /users:
    get:
      operationId: listUsers
      summary: List the company's members.
      tags: [admin]
      security:
        - companySession: []
      x-permission: users:read
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createUser
      summary: Add a member. Only owners grant owner.
      tags: [admin]
      security:
        - companySession: []
      x-permission: users:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"

  /users/{id}:
    get:
      operationId: getUser
      summary: Get a member.
      tags: [admin]
      security:
        - companySession: []
      x-permission: users:read
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateUser
      summary: Change a member's name or role. Members cannot change their own role.
      tags: [admin]
      security:
        - companySession: []
      x-permission: users:write
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteUser
      summary: Remove a member. Members cannot remove themselves.
      tags: [admin]
      security:
        - companySession: []
      x-permission: users:write
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Success.
        default:
          $ref: "#/components/responses/Error"

  /interviews:
    get:
      operationId: listInterviews
      summary: List the company's interviews, newest first.
      tags: [admin]
      security:
        - companySession: []
      x-permission: interviews:read
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/InterviewStatus"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [interviews]
                properties:
                  interviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/Interview"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInterview
      summary: Schedule an interview.
      tags: [admin]
      security:
        - companySession: []
      x-permission: interviews:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInterviewRequest"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interview"
        default:
          $ref: "#/components/responses/Error"

  /interviews/{id}:
    get:
      operationId: getInterview
      summary: Get an interview.
      tags: [admin]
      security:
        - companySession: []
      x-permission: interviews:read
      parameters:
        - $ref: "#/components/parameters/InterviewId"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interview"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateInterview
      summary: Update an interview. A terminal status sets terminal_at once. Interviews are never deleted; see erase.
      tags: [admin]
      security:
        - companySession: []
      x-permission: interviews:write
      parameters:
        - $ref: "#/components/parameters/InterviewId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInterviewRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interview"
        default:
          $ref: "#/components/responses/Error"

  /interviews/{id}/erase:
    post:
      operationId: requestInterviewErasure
      summary: Request erasure. Only sets erase_requested_at (keeping the first request's time); nothing is deleted here. A purge job acts on it later, honoring legal holds.
      tags: [admin]
      security:
        - companySession: []
      x-permission: interviews:erase
      parameters:
        - $ref: "#/components/parameters/InterviewId"
      responses:
        "202":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EraseAccepted"
        default:
          $ref: "#/components/responses/Error"

  /interviews/{id}/scores:
    get:
      operationId: listInterviewScores
      summary: List an interview's proposed scores and their decisions.
      tags: [admin]
      security:
        - companySession: []
      x-permission: scores:read
      parameters:
        - $ref: "#/components/parameters/InterviewId"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [scores]
                properties:
                  scores:
                    type: array
                    items:
                      $ref: "#/components/schemas/Score"
        default:
          $ref: "#/components/responses/Error"

  /interviews/{id}/scores/{scoreId}/decision:
    post:
      operationId: decideInterviewScore
      summary: Record a human decision on a score. Only human_* statuses are accepted.
      tags: [admin]
      security:
        - companySession: []
      x-permission: scores:approve
      parameters:
        - $ref: "#/components/parameters/InterviewId"
        - name: scoreId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreDecisionRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Score"
        default:
          $ref: "#/components/responses/Error"

  /interviews/{id}/live:
    get:
      operationId: watchInterviewLive
      summary: Stream the interview's events live as SSE (live-monitor service). Each event's id is its sequence number; send it back as Last-Event-ID to resume.
      tags: [live]
      security:
        - companySession: []
      x-permission: interviews:live
      parameters:
        - $ref: "#/components/parameters/InterviewId"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
      responses:
        "200":
          description: >
            text/event-stream of `event` events (data is a TimelineEvent,
            id its sequence_number), one `caught_up` event after the
            replay of missed events, and `: ping` heartbeats.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Error"

  /tasks:
    get:
      operationId: listTasks
      summary: List tasks.
      tags: [admin]
      security:
        - companySession: []
      x-permission: tasks:read
      parameters:
        - name: interview_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: assignee_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TaskStatus"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createTask
      summary: Create a task.
      tags: [admin]
      security:
        - companySession: []
      x-permission: tasks:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"

  /tasks/{id}:
    get:
      operationId: getTask
      summary: Get a task.
      tags: [admin]
      security:
        - companySession: []
      x-permission: tasks:read
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: updateTask
      summary: Update a task. assignee_id null unassigns; status done sets completed_at.
      tags: [admin]
      security:
        - companySession: []
      x-permission: tasks:write
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteTask
      summary: Delete a task.
      tags: [admin]
      security:
        - companySession: []
      x-permission: tasks:write
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "204":
          description: Success.
        default:
          $ref: "#/components/responses/Error"

  /invites:
    post:
      operationId: createInvite
      summary: Issue a tokenized invite. With interview_id it invites the candidate to that interview (invites:candidate); otherwise a member with role (invites:member). The token is returned once.
      tags: [admin]
      security:
        - companySession: []
      x-permission: invites:candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInviteRequest"
      responses:
        "201":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        default:
          $ref: "#/components/responses/Error"

  /policies:
    get:
      operationId: listPolicies
      summary: The company's policy toggles, defaults filled in.
      tags: [admin]
      security:
        - companySession: []
      x-permission: policies:read
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [policies]
                properties:
                  policies:
                    type: array
                    items:
                      $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Error"

  /policies/{key}:
    put:
      operationId: setPolicy
      summary: Turn a policy on or off.
      tags: [admin]
      security:
        - companySession: []
      x-permission: policies:write
      parameters:
        - name: key
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/PolicyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPolicyRequest"
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Policy"
        default:
          $ref: "#/components/responses/Error"

  /dashboard/overview:
    get:
      operationId: getDashboardOverview
      summary: Daily event counts by type (ClickHouse materialized view).
      tags: [dashboard]
      security:
        - companySession: []
      x-permission: analytics:read
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 90
            default: 14
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
        default:
          $ref: "#/components/responses/Error"

  /dashboard/interviews:
    get:
      operationId: getDashboardInterviews
      summary: Per-interview activity (ClickHouse materialized view), most recently active first.
      tags: [dashboard]
      security:
        - companySession: []
      x-permission: analytics:read
      responses:
        "200":
          description: Success.
          content:
            application/json:
              schema:
                type: object
                required: [interviews]
                properties:
                  interviews:
                    type: array
                    items:
                      $ref: "#/components/schemas/InterviewActivity"
        default:
          $ref: "#/components/responses/Error"

  /admin/jobs:
    get:
      operationId: listJobs
      summary: List job requisitions for the authenticated company.
      tags: [admin]
      responses:
        "200":
          description: The company's job requisitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createJob
      summary: Create a new job requisition.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: The created job requisition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"

  /admin/jobs/{jobId}:
    get:
      operationId: getJob
      summary: Get a single job requisition.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job requisition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"

  /admin/candidates/{candidateId}/stage:
    post:
      operationId: changeCandidateStage
      summary: Move a candidate to a new pipeline stage.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageChangeRequest"
      responses:
        "200":
          description: The updated application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
    companySession:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >
        A company member's session token. The request is scoped to that
        member's company; Candidate Workspace tokens are rejected.

  parameters:
    InterviewId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: An error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    TimelineResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"

    TimelineEvent:
      type: object
      required: [event_id, company_id, interview_id, sequence_number, event_type, occurred_at, payload]
      properties:
        event_id:
          type: string
        company_id:
          type: string
          format: uuid
        interview_id:
          type: string
          format: uuid
        sequence_number:
          type: integer
          format: int64
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true

    StartSessionRequest:
      type: object
      required: [inviteToken]
      additionalProperties: false
      properties:
        inviteToken:
          type: string
          minLength: 1

    StartSessionResponse:
      type: object
      required: [sessionId, accessToken, tokenType, scope, expiresAt]
      properties:
        sessionId:
          type: string
          format: uuid
        accessToken:
          type: string
          description: Opaque bearer token; this value is returned only once.
        tokenType:
          type: string
          enum: [Bearer]
        scope:
          type: string
          enum: ["candidate:workspace"]
        expiresAt:
          type: string
          format: date-time

    ChatMessage:
      type: object
      required: [role, content]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          minLength: 1

    PromptRequest:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 32768
        history:
          type: array
          maxItems: 50
          description: Earlier turns of this conversation, oldest first.
          items:
            $ref: "#/components/schemas/ChatMessage"

    PromptAccepted:
      type: object
      description: Data of the `prompt` SSE event.
      required: [promptId, sequenceNumber]
      properties:
        promptId:
          type: string
          format: uuid
        sequenceNumber:
          type: integer
          format: int64

    PromptDelta:
      type: object
      description: Data of a `delta` SSE event.
      required: [text]
      properties:
        text:
          type: string

    PromptDone:
      type: object
      description: Data of the final `done` SSE event.
      required: [status]
      properties:
        status:
          type: string
          enum: [completed, truncated, refused, error, cancelled]
        stopReason:
          type: string
        errorCode:
          type: string

    RunRequest:
      type: object
      required: [language, entrypoint, files]
      additionalProperties: false
      properties:
        language:
          type: string
          enum: [python, javascript, shell]
        entrypoint:
          type: string
          description: The file in `files` to run.
        files:
          type: object
          description: Workspace snapshot, keyed by relative path.
          additionalProperties:
            type: string
        stdin:
          type: string
          maxLength: 65536

    RunResult:
      type: object
      required: [executionId, status, exitCode, stdout, stderr, stdoutTruncated, stderrTruncated, durationMs]
      properties:
        executionId:
          type: string
          format: uuid
        status:
          type: string
          enum: [succeeded, failed, timed_out, oom_killed, error]
        exitCode:
          type: integer
        stdout:
          type: string
        stderr:
          type: string
        stdoutTruncated:
          type: boolean
        stderrTruncated:
          type: boolean
        durationMs:
          type: integer
          format: int64

    DiffRequest:
      type: object
      required: [clientSeq, origin, path, patch]
      additionalProperties: false
      properties:
        clientSeq:
          type: integer
          format: int64
          minimum: 1
        origin:
          type: string
          enum: [manual, ai_applied]
        promptId:
          type: string
          format: uuid
          description: For ai_applied diffs, the prompt whose answer was applied.
        path:
          type: string
        patch:
          type: string
          description: Single-file unified diff; hunk line counts must match.
          maxLength: 262144

    DiffResult:
      type: object
      required: [accepted, linesAdded, linesRemoved]
      properties:
        accepted:
          type: boolean
        sequenceNumber:
          type: integer
          format: int64
        reason:
          type: string
          enum: [out_of_order]
        linesAdded:
          type: integer
        linesRemoved:
          type: integer

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string

    Role:
      type: string
      enum: [owner, admin, recruiter, interviewer, viewer]
