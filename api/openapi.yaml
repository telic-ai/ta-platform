openapi: 3.0.3
info:
  title: ta-platform API
  version: 0.1.0
  description: >
    Candidate and admin HTTP APIs for the ta-platform talent-acquisition
    platform. This is an initial contract scaffold; extend it as
    Candidate Workspace Service and Admin API endpoints are built out.
servers:
  - url: /v1

paths:
  /interviews/{id}/timeline:
    get:
      operationId: getInterviewTimeline
      summary: Replay an interview's events after an optional sequence cursor.
      tags: [replay]
      security:
        - companyIdentity: []
      parameters:
        - $ref: "#/components/parameters/InterviewId"
        - name: after_seq
          in: query
          required: false
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
      responses:
        "200":
          description: Events ordered by ascending sequence number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimelineResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /session/start:
    post:
      operationId: startSession
      summary: Exchange a one-time invite for a scoped Candidate Workspace session token.
      tags: [session]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSessionRequest"
      responses:
        "200":
          description: An Active Candidate Workspace session.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartSessionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"

  /candidate/me:
    get:
      operationId: getCurrentCandidate
      summary: Get the authenticated candidate's profile.
      tags: [candidate]
      security:
        - sessionToken: []
      responses:
        "200":
          description: The candidate profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidate"
        "409":
          description: The session exists but is not Active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /candidate/applications:
    get:
      operationId: listMyApplications
      summary: List the authenticated candidate's applications.
      tags: [candidate]
      security:
        - sessionToken: []
      responses:
        "200":
          description: The candidate's applications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "409":
          description: The session exists but is not Active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"

  /admin/jobs:
    get:
      operationId: listJobs
      summary: List job requisitions for the authenticated company.
      tags: [admin]
      responses:
        "200":
          description: The company's job requisitions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createJob
      summary: Create a new job requisition.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: The created job requisition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"

  /admin/jobs/{jobId}:
    get:
      operationId: getJob
      summary: Get a single job requisition.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: The job requisition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        default:
          $ref: "#/components/responses/Error"

  /admin/candidates/{candidateId}/stage:
    post:
      operationId: changeCandidateStage
      summary: Move a candidate to a new pipeline stage.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/CandidateId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageChangeRequest"
      responses:
        "200":
          description: The updated application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      bearerFormat: opaque
    companyIdentity:
      type: apiKey
      in: header
      name: X-Company-ID
      description: Trusted company identity injected by the authenticated gateway.

  parameters:
    InterviewId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: An error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    TimelineResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"

    TimelineEvent:
      type: object
      required: [event_id, company_id, interview_id, sequence_number, event_type, occurred_at, payload]
      properties:
        event_id:
          type: string
        company_id:
          type: string
          format: uuid
        interview_id:
          type: string
          format: uuid
        sequence_number:
          type: integer
          format: int64
        event_type:
          type: string
        occurred_at:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true

    StartSessionRequest:
      type: object
      required: [inviteToken]
      additionalProperties: false
      properties:
        inviteToken:
          type: string
          minLength: 1

    StartSessionResponse:
      type: object
      required: [sessionId, accessToken, tokenType, scope, expiresAt]
      properties:
        sessionId:
          type: string
          format: uuid
        accessToken:
          type: string
          description: Opaque bearer token; this value is returned only once.
        tokenType:
          type: string
          enum: [Bearer]
        scope:
          type: string
          enum: ["candidate:workspace"]
        expiresAt:
          type: string
          format: date-time

    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
        code:
          type: string

    Candidate:
      type: object
      required: [id, email, fullName]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        fullName:
          type: string

    Job:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: string
        title:
          type: string
        location:
          type: string
        remoteOk:
          type: boolean
        status:
          type: string
          enum: [open, closed]

    CreateJobRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        location:
          type: string
        remoteOk:
          type: boolean

    Application:
      type: object
      required: [id, jobId, candidateId, stage]
      properties:
        id:
          type: string
        jobId:
          type: string
        candidateId:
          type: string
        stage:
          type: string

    StageChangeRequest:
      type: object
      required: [applicationId, toStage]
      properties:
        applicationId:
          type: string
        toStage:
          type: string
