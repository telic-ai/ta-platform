asyncapi: 3.0.0
info:
  title: Session Events
  version: 1.0.0
  description: Candidate Workspace session lifecycle events.
channels:
  sessionEvents:
    address: session-events
    description: >
      Records are keyed by session_id and ordered within one partition.
      Producers write events to the Postgres event_outbox in the same
      transaction as the state change; a relay publishes them in order.
    messages:
      sessionStarted:
        $ref: '#/components/messages/SessionStarted'
      promptSubmitted:
        $ref: '#/components/messages/PromptSubmitted'
      aiResponseCompleted:
        $ref: '#/components/messages/AIResponseCompleted'
      executionRequested:
        $ref: '#/components/messages/ExecutionRequested'
      executionCompleted:
        $ref: '#/components/messages/ExecutionCompleted'
      codeDiff:
        $ref: '#/components/messages/CodeDiff'
operations:
  publishSessionEvent:
    action: send
    channel:
      $ref: '#/channels/sessionEvents'
components:
  messages:
    SessionStarted:
      name: session.started
      contentType: application/json
      correlationId:
        location: $message.payload#/payload/session_id
      payload:
        $ref: '#/components/schemas/Envelope'
    PromptSubmitted:
      name: prompt.submitted
      contentType: application/json
      description: >
        Written to the outbox by the Candidate Workspace before the prompt is
        sent to the AI Gateway. Two sequence numbers are allocated together:
        this event's, and completion_sequence_number for the resulting
        ai.response.completed.
      payload:
        type: object
        required: [event_id, event_type, schema_version, company_id, sequence_number, occurred_at, payload]
        properties:
          event_type: {type: string, const: prompt.submitted}
          schema_version: {type: integer, const: 1}
          payload:
            type: object
            required: [session_id, interview_id, prompt_id, prompt, history_turns, completion_sequence_number]
            properties:
              session_id: {type: string}
              interview_id: {type: string}
              prompt_id: {type: string}
              prompt: {type: string}
              history_turns: {type: integer, description: Earlier conversation turns sent with the prompt.}
              completion_sequence_number: {type: integer, description: Reserved for this prompt's ai.response.completed.}
    AIResponseCompleted:
      name: ai.response.completed
      contentType: application/json
      description: >
        Produced directly by the AI Gateway (acks=all) for every completion,
        whatever its outcome. sequence_number is allocated by the Candidate
        Workspace together with the prompt.submitted that caused it, so it is
        always greater than that prompt's sequence_number.
      payload:
        type: object
        required: [event_id, event_type, schema_version, company_id, sequence_number, occurred_at, payload]
        properties:
          event_type: {type: string, const: ai.response.completed}
          schema_version: {type: integer, const: 1}
          payload:
            type: object
            required: [session_id, interview_id, prompt_id, mode, provider, model, status, response_text, input_tokens, output_tokens, latency_ms]
            properties:
              session_id: {type: string}
              interview_id: {type: string}
              prompt_id: {type: string}
              mode: {type: string, enum: [managed, byok]}
              provider: {type: string}
              model: {type: string}
              status: {type: string, enum: [completed, truncated, refused, error, cancelled]}
              stop_reason: {type: string, description: Provider stop reason, e.g. end_turn or max_tokens.}
              error_code: {type: string, description: Stable non-sensitive code; set for error and cancelled.}
              response_text: {type: string, description: Text streamed before the completion ended.}
              input_tokens: {type: integer}
              output_tokens: {type: integer}
              latency_ms: {type: integer}
    ExecutionRequested:
      name: execution.requested
      contentType: application/json
      description: Written after the run's snapshot is stored in S3 and before the sandbox is called.
      payload:
        type: object
        properties:
          event_type: {type: string, const: execution.requested}
          schema_version: {type: integer, const: 1}
          payload:
            type: object
            required: [session_id, interview_id, execution_id, language, entrypoint, snapshot_key, file_count, snapshot_bytes]
            properties:
              session_id: {type: string}
              interview_id: {type: string}
              execution_id: {type: string}
              language: {type: string}
              entrypoint: {type: string}
              snapshot_key: {type: string, description: "S3 key: companies/{company}/interviews/{interview}/snapshots/{execution}.json"}
              file_count: {type: integer}
              snapshot_bytes: {type: integer}
    ExecutionCompleted:
      name: execution.completed
      contentType: application/json
      description: >
        Written once the sandbox returns, for every requested execution,
        including when the candidate disconnected. Output is capped at 64 KiB
        per stream.
      payload:
        type: object
        properties:
          event_type: {type: string, const: execution.completed}
          schema_version: {type: integer, const: 1}
          payload:
            type: object
            required: [session_id, interview_id, execution_id, status, exit_code, duration_ms, stdout, stderr, stdout_truncated, stderr_truncated]
            properties:
              session_id: {type: string}
              interview_id: {type: string}
              execution_id: {type: string}
              status: {type: string, enum: [succeeded, failed, timed_out, oom_killed, error]}
              exit_code: {type: integer, description: -1 when the program was killed or never ran.}
              duration_ms: {type: integer}
              stdout: {type: string}
              stderr: {type: string}
              stdout_truncated: {type: boolean}
              stderr_truncated: {type: boolean}
              error_code: {type: string, description: Set when status is error.}
    CodeDiff:
      name: code.diff
      contentType: application/json
      description: >
        One accepted, debounced edit. Diffs whose client_sequence is not
        greater than the session's last accepted one are dropped and never
        produce this event. origin feeds the manual-vs-AI ratio.
      payload:
        type: object
        properties:
          event_type: {type: string, const: code.diff}
          schema_version: {type: integer, const: 1}
          payload:
            type: object
            required: [session_id, interview_id, client_sequence, origin, path, patch, lines_added, lines_removed]
            properties:
              session_id: {type: string}
              interview_id: {type: string}
              client_sequence: {type: integer}
              origin: {type: string, enum: [manual, ai_applied]}
              prompt_id: {type: string, description: The applied prompt, for ai_applied diffs.}
              path: {type: string}
              patch: {type: string, description: Single-file unified diff.}
              lines_added: {type: integer}
              lines_removed: {type: integer}
  schemas:
    Envelope:
      type: object
      required: [event_id, event_type, schema_version, company_id, sequence_number, occurred_at, payload]
      properties:
        event_id: {type: string}
        event_type: {type: string, const: session.started}
        schema_version: {type: integer, const: 1}
        company_id: {type: string}
        sequence_number: {type: integer, minimum: 1, description: Per-interview sequence allocated in Postgres (interviews.last_sequence_number).}
        occurred_at: {type: string, format: date-time}
        payload:
          type: object
          required: [session_id, interview_id, invite_id, scope, expires_at]
          properties:
            session_id: {type: string, description: Kafka record key and ordering boundary.}
            interview_id: {type: string, description: Interview the session belongs to; the event log's partition key.}
            invite_id: {type: string}
            scope: {type: string}
            expires_at: {type: string, format: date-time}
