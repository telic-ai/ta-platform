asyncapi: 3.0.0
info:
  title: Session Events
  version: 1.0.0
  description: Candidate Workspace session lifecycle events.
channels:
  sessionEvents:
    address: session-events
    description: >
      Records are keyed by session_id and ordered within one partition.
      Producers write events to the Postgres event_outbox in the same
      transaction as the state change; a relay publishes them in order.
    messages:
      sessionStarted:
        $ref: '#/components/messages/SessionStarted'
      aiResponseCompleted:
        $ref: '#/components/messages/AIResponseCompleted'
operations:
  publishSessionEvent:
    action: send
    channel:
      $ref: '#/channels/sessionEvents'
components:
  messages:
    SessionStarted:
      name: session.started
      contentType: application/json
      correlationId:
        location: $message.payload#/payload/session_id
      payload:
        $ref: '#/components/schemas/Envelope'
    AIResponseCompleted:
      name: ai.response.completed
      contentType: application/json
      description: >
        Produced directly by the AI Gateway (acks=all) for every completion,
        whatever its outcome. sequence_number is allocated by the Candidate
        Workspace together with the prompt.submitted that caused it, so it is
        always greater than that prompt's sequence_number.
      payload:
        type: object
        required: [event_id, event_type, schema_version, company_id, sequence_number, occurred_at, payload]
        properties:
          event_type: {type: string, const: ai.response.completed}
          schema_version: {type: integer, const: 1}
          payload:
            type: object
            required: [session_id, interview_id, prompt_id, mode, provider, model, status, response_text, input_tokens, output_tokens, latency_ms]
            properties:
              session_id: {type: string}
              interview_id: {type: string}
              prompt_id: {type: string}
              mode: {type: string, enum: [managed, byok]}
              provider: {type: string}
              model: {type: string}
              status: {type: string, enum: [completed, truncated, refused, error, cancelled]}
              stop_reason: {type: string, description: Provider stop reason, e.g. end_turn or max_tokens.}
              error_code: {type: string, description: Stable non-sensitive code; set for error and cancelled.}
              response_text: {type: string, description: Text streamed before the completion ended.}
              input_tokens: {type: integer}
              output_tokens: {type: integer}
              latency_ms: {type: integer}
  schemas:
    Envelope:
      type: object
      required: [event_id, event_type, schema_version, company_id, sequence_number, occurred_at, payload]
      properties:
        event_id: {type: string}
        event_type: {type: string, const: session.started}
        schema_version: {type: integer, const: 1}
        company_id: {type: string}
        sequence_number: {type: integer, minimum: 1, description: Per-interview sequence allocated in Postgres (interviews.last_sequence_number).}
        occurred_at: {type: string, format: date-time}
        payload:
          type: object
          required: [session_id, interview_id, invite_id, scope, expires_at]
          properties:
            session_id: {type: string, description: Kafka record key and ordering boundary.}
            interview_id: {type: string, description: Interview the session belongs to; the event log's partition key.}
            invite_id: {type: string}
            scope: {type: string}
            expires_at: {type: string, format: date-time}
